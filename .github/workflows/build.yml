name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A82AED: ${{ secrets.A82AED }}
          B2BB75: ${{ secrets.B2BB75 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A82AED', '')
          k2 = os.environ.get('B2BB75', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 0f34086c445527567fe3da5d972ed5dc9c -->', k1) if k1 else txt
          out = out.replace('<!-- eec391ac61b8a3d6adb4ae9b1b886b56 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
